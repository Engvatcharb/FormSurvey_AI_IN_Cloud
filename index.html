<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI-in-Cloud Trust Policy Adoption — Questionnaire</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0b1929;--blue:#1a3f6f;--mid:#1d5fa8;--accent:#3b9ede;--sky:#e8f3fb;
  --gold:#b8861a;--gold-lt:#fdf3dc;
  --green:#16724a;--green-lt:#e8f7ef;
  --red:#c0392b;--red-lt:#fdecea;
  --white:#fff;--pale:#f5f8fd;--border:#d0dff0;
  --text:#18283d;--muted:#6b7a92;
  --r:10px;--rlg:16px;
  --sh:0 2px 18px rgba(11,25,41,.09);
  --sh-lg:0 8px 40px rgba(11,25,41,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--pale);color:var(--text);min-height:100vh}
.th{font-family:'Sarabun',sans-serif}

/* ══ PAGES ══ */
.page{display:none;animation:fadeIn .35s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ══ STICKY LANG BAR ══ */
.lang-bar{
  position:sticky;top:0;z-index:200;
  background:var(--navy);
  padding:9px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 2px 12px rgba(0,0,0,.3);
}
.lang-bar-left{display:flex;align-items:center;gap:10px}
.lang-bar-title{color:rgba(255,255,255,.5);font-size:11px;font-family:'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase}
.lbtn{padding:5px 16px;border-radius:20px;border:1.5px solid rgba(255,255,255,.28);background:transparent;color:rgba(255,255,255,.65);font-size:12.5px;cursor:pointer;transition:all .18s;font-family:'DM Sans',sans-serif}
.lbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lbtn:hover:not(.on){border-color:rgba(255,255,255,.55);color:#fff}
.prog-mini{display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(255,255,255,.5);font-family:'DM Mono',monospace}
.prog-mini-bar{width:80px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.prog-mini-fill{height:100%;background:var(--accent);border-radius:2px;width:0;transition:width .4s}

/* ══ HERO BAND ══ */
.hero{
  background:linear-gradient(135deg,var(--navy) 0%,#163360 55%,#1a4a8a 100%);
  padding:48px 24px 40px;text-align:center;position:relative;overflow:hidden;
}
.hero::after{
  content:'';position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.018'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events:none;
}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(59,158,222,.18);border:1px solid rgba(59,158,222,.38);color:#7fc8f0;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;padding:5px 16px;border-radius:20px;margin-bottom:20px;position:relative;z-index:1}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(19px,3.2vw,30px);font-weight:700;color:#fff;line-height:1.28;max-width:760px;margin:0 auto 10px;position:relative;z-index:1}
.hero h2{font-family:'Sarabun',sans-serif;font-size:clamp(15px,2.4vw,21px);font-weight:400;color:rgba(255,255,255,.65);line-height:1.45;max-width:680px;margin:0 auto 26px;position:relative;z-index:1}
.hero-chips{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;position:relative;z-index:1}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.82);font-size:11.5px;padding:4px 13px;border-radius:6px;font-family:'DM Mono',monospace}

/* ══ WRAP ══ */
.wrap{max-width:820px;margin:0 auto;padding:0 18px}

/* ══ CONSENT PAGE ══ */
.consent-card{background:var(--white);border:1px solid var(--border);border-radius:var(--rlg);box-shadow:var(--sh-lg);margin:28px auto;max-width:820px;overflow:hidden}
.consent-sec{padding:28px 32px;border-bottom:1px solid #eef3fb}
.consent-sec:last-child{border-bottom:none}
.consent-sec h3{font-size:17px;font-weight:600;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.consent-sec h3 .ico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.consent-sec p,.consent-sec li{font-size:16px;line-height:1.75;color:#444}
.consent-sec ul{padding-left:20px;display:flex;flex-direction:column;gap:5px;margin-top:8px}
.consent-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.consent-item{background:var(--pale);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.consent-item .ci-label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.consent-item .ci-val{font-size:15px;color:var(--text);line-height:1.5}
.agree-box{padding:24px 32px;background:var(--gold-lt);border-top:2px solid #e8c96a}
.agree-check{display:flex;align-items:flex-start;gap:12px;cursor:pointer;margin-bottom:18px}
.agree-check input[type=checkbox]{width:20px;height:20px;cursor:pointer;flex-shrink:0;margin-top:2px;accent-color:var(--mid)}
.agree-check span{font-size:13.5px;line-height:1.65;color:var(--text)}
.btn-start{width:100%;padding:17px;background:linear-gradient(135deg,var(--navy),var(--mid));color:#fff;font-size:18px;font-weight:600;border:none;border-radius:10px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;letter-spacing:.3px;opacity:.45;pointer-events:none}
.btn-start.ready{opacity:1;pointer-events:all}
.btn-start.ready:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(29,95,168,.35)}
.consent-radio-group{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.consent-radio-opt{display:flex;align-items:flex-start;gap:13px;padding:14px 18px;border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all .18s;background:var(--white)}
.consent-radio-opt:hover{border-color:var(--mid);background:var(--sky)}
.consent-radio-opt.selected-agree{border-color:var(--green);background:var(--green-lt)}
.consent-radio-opt.selected-decline{border-color:var(--red);background:var(--red-lt)}
.consent-radio-opt input[type=radio]{width:18px;height:18px;cursor:pointer;flex-shrink:0;margin-top:2px;accent-color:var(--mid)}
.consent-radio-opt span{font-size:16px;line-height:1.65;color:var(--text)}
.decline-msg{display:none;background:var(--red-lt);border:1px solid #f5b7b1;border-radius:10px;padding:16px 20px;margin-top:4px;font-size:15.5px;line-height:1.65;color:#7b241c}
.decline-msg.show{display:block}

/* ══ PROGRESS ══ */
.prog-wrap{max-width:820px;margin:22px auto 0;padding:0 18px}
.prog-hdr{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:7px;font-family:'DM Mono',monospace}
.prog-bar{height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--mid),var(--accent));border-radius:4px;width:0;transition:width .4s}

/* ══ INSTR BOX ══ */
.instr-box{max-width:820px;margin:18px auto 0;padding:0 18px}
.instr-inner{background:var(--white);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:var(--r);padding:20px 24px;font-size:16px;line-height:1.7;color:#444}
.scale-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.sc{display:flex;align-items:center;gap:6px;background:var(--pale);border:1px solid var(--border);border-radius:7px;padding:7px 14px;font-size:14px}
.sc-n{width:26px;height:26px;border-radius:50%;border:2px solid var(--mid);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--mid);background:#fff;flex-shrink:0}

/* ══ SECTION CARD ══ */
.sec-card{background:var(--white);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh);margin-bottom:22px;overflow:hidden;transition:box-shadow .2s}
.sec-card:hover{box-shadow:var(--sh-lg)}
.sec-hdr{background:linear-gradient(90deg,var(--navy) 0%,var(--blue) 100%);padding:15px 22px;display:flex;align-items:center;gap:13px}
.sec-num{width:32px;height:32px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:11px;color:#fff;flex-shrink:0;font-weight:500}
.sec-name{font-family:'Playfair Display',serif;font-size:19px;font-weight:600;color:#fff;line-height:1.2}
.sec-code{font-family:'DM Mono',monospace;font-size:13px;color:rgba(255,255,255,.5);letter-spacing:1px;margin-top:2px}
.sec-cnt{margin-left:auto;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.72);font-size:13px;padding:3px 11px;border-radius:12px;font-family:'DM Mono',monospace;white-space:nowrap}

/* ══ QUESTION ROW ══ */
.q-row{padding:16px 22px;border-bottom:1px solid #edf1f8;transition:background .14s}
.q-row:last-child{border-bottom:none}
.q-row:hover{background:#fafcff}
.q-row.answered{background:#f4fbf7}
.q-row.error .q-txt{color:var(--red)}
.q-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.q-id{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:#fff;background:var(--mid);padding:3px 8px;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:2px;transition:background .2s}
.q-row.answered .q-id{background:var(--green)}
.q-row.error .q-id{background:var(--red)}
.q-txt{font-size:17px;line-height:1.68;color:var(--text)}
.lkrt-lbls{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);font-style:italic;margin-bottom:7px}
.lkrt{display:flex;gap:5px}
.lk{flex:1}
.lk input{display:none}
.lk label{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:12px 4px;border:1.5px solid var(--border);border-radius:8px;background:var(--pale);transition:all .15s;font-size:20px;color:var(--muted);font-family:'DM Mono',monospace;font-weight:500;width:100%;text-align:center;user-select:none}
.lk label:hover{border-color:var(--accent);background:var(--sky);color:var(--blue)}
.lk input:checked+label{border-color:var(--mid);background:var(--mid);color:#fff;box-shadow:0 2px 8px rgba(29,95,168,.28)}
.lk-desc{font-size:13px;line-height:1.3;font-family:'DM Sans','Sarabun',sans-serif;font-weight:400;margin-top:4px}
.lang-en .lk-desc{font-size:15.5px;line-height:1.25;font-weight:500}
.lang-en .lkrt-lbls{font-size:17px}
.lang-en .lk label{font-size:22px;padding:14px 4px}
.lang-th .lk-desc{font-size:15px;line-height:1.35;font-weight:500;font-family:'Sarabun',sans-serif}
.lang-th .lkrt-lbls{font-size:16px;font-family:'Sarabun',sans-serif}
.lang-th .lk label{font-size:21px;padding:14px 4px;font-family:'DM Mono',monospace}
.err-msg{font-size:14px;color:var(--red);margin-top:7px;display:none;font-style:italic}
.q-row.error .err-msg{display:block}

/* ══ DEMOGRAPHICS ══ */
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px 22px}
@media(max-width:540px){.demo-grid{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:6px}
.fld.full{grid-column:1/-1}
.fld label{font-size:15px;font-weight:600;color:var(--navy)}
.sw{position:relative}
.sw::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:16px}
.sw select,.fld input{padding:12px 16px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans','Sarabun',sans-serif;font-size:16px;color:var(--text);background:var(--pale);outline:none;transition:border-color .15s;appearance:none;width:100%}
.sw select:focus,.fld input:focus{border-color:var(--accent);background:#fff}

/* ══ SUBMIT ══ */
.sub-area{max-width:820px;margin:10px auto 0;padding:0 18px 60px;text-align:center}
.sub-note{font-size:15px;color:var(--muted);margin-bottom:14px;line-height:1.65}
.btn-sub{background:linear-gradient(135deg,var(--navy),var(--mid));color:#fff;font-size:18px;font-weight:600;padding:15px 52px;border:none;border-radius:10px;cursor:pointer;box-shadow:0 4px 18px rgba(11,25,41,.22);transition:all .2s;letter-spacing:.3px;font-family:'DM Sans',sans-serif}
.btn-sub:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(11,25,41,.3)}

/* ══ DASHBOARD ══ */
.dash-wrap{max-width:900px;margin:0 auto;padding:24px 18px 60px}
.dash-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.dash-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--navy)}
.btn-exp{background:var(--green);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;margin-left:8px}
.btn-exp:hover{background:#115a39}
.btn-clr{background:var(--mid);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.btn-clr:hover{background:var(--blue)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-align:center;box-shadow:var(--sh)}
.stat-num{font-size:30px;font-weight:700;color:var(--mid);font-family:'Playfair Display',serif}
.stat-lbl{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.chart-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;box-shadow:var(--sh);margin-bottom:18px}
.chart-card h3{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:14px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
@media(max-width:600px){.chart-grid{grid-template-columns:1fr}}
.ch-wrap{position:relative;height:200px}
.ch-wrap-lg{position:relative;height:260px}
.rtbl-wrap{background:var(--white);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:22px}
.rtbl-title{padding:13px 18px;font-size:13px;font-weight:600;color:var(--navy);border-bottom:1px solid var(--border);background:var(--pale)}
.rtbl{width:100%;border-collapse:collapse;font-size:12px}
.rtbl th{background:var(--navy);color:#fff;padding:9px 12px;text-align:left;font-weight:500}
.rtbl td{padding:8px 12px;border-bottom:1px solid #eef2f8;color:var(--text)}
.rtbl tr:last-child td{border-bottom:none}
.rtbl tr:hover td{background:var(--pale)}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:500}
.badge-th{background:#fff3e0;color:#a05000}
.badge-en{background:#e3f2fd;color:#0d47a1}
.no-data{text-align:center;padding:48px 20px;color:var(--muted);font-style:italic;font-size:13px}

/* ══ TAB NAV ══ */
.tab-nav{display:flex;background:var(--white);border-bottom:2px solid var(--border);position:sticky;top:44px;z-index:150}
#t-dash{display:none}
#t-dash.owner-visible{display:flex}
.owner-login-overlay{display:none;position:fixed;inset:0;background:rgba(11,25,41,.75);backdrop-filter:blur(5px);z-index:998;align-items:center;justify-content:center;padding:20px}
.owner-login-overlay.show{display:flex}
.owner-modal{background:#fff;border-radius:16px;padding:36px 32px;max-width:380px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:popIn .28s ease}
.owner-modal h3{font-family:'Playfair Display',serif;font-size:20px;color:var(--navy);margin-bottom:6px}
.owner-modal p{font-size:14px;color:var(--muted);margin-bottom:22px;line-height:1.6}
.owner-input{width:100%;padding:13px 16px;border:2px solid var(--border);border-radius:10px;font-size:16px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;text-align:center;letter-spacing:3px;margin-bottom:12px;transition:border-color .2s}
.owner-input:focus{border-color:var(--mid)}
.owner-input.error{border-color:var(--red);animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.owner-err{font-size:13px;color:var(--red);margin-bottom:14px;min-height:18px}
.btn-owner-login{width:100%;padding:13px;background:linear-gradient(135deg,var(--navy),var(--mid));color:#fff;font-size:15px;font-weight:600;border:none;border-radius:10px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;margin-bottom:10px}
.btn-owner-login:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(29,95,168,.3)}
.btn-owner-cancel{width:100%;padding:10px;background:transparent;color:var(--muted);font-size:14px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-owner-cancel:hover{color:var(--navy)}
.owner-badge{position:fixed;bottom:18px;right:18px;background:var(--navy);color:#fff;border:none;padding:9px 16px;border-radius:20px;font-size:12px;font-family:'DM Mono',monospace;cursor:pointer;z-index:500;opacity:.55;transition:opacity .2s;letter-spacing:.5px}
.owner-badge:hover{opacity:1}
.owner-badge.logged-in{background:var(--green);opacity:.8}
.tab-btn{flex:1;padding:14px 8px;text-align:center;font-size:15px;font-weight:500;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:'DM Sans',sans-serif}
.tab-btn.on{color:var(--mid);border-bottom-color:var(--mid);font-weight:600}

/* ══ SUCCESS OVERLAY ══ */
.overlay{display:none;position:fixed;inset:0;background:rgba(11,25,41,.72);backdrop-filter:blur(4px);z-index:999;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:18px;padding:44px 40px;max-width:440px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.28);animation:popIn .3s ease}
@keyframes popIn{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.modal-ico{width:62px;height:62px;background:var(--green-lt);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px}
.modal h2{font-family:'Playfair Display',serif;font-size:26px;color:var(--navy);margin-bottom:10px}
.modal p{font-size:16px;color:var(--muted);line-height:1.65;margin-bottom:22px}
.btn-modal{background:var(--navy);color:#fff;border:none;padding:13px 36px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .2s}
.btn-modal:hover{background:var(--blue)}

@media(max-width:580px){
  .hero{padding:32px 16px 28px}
  .sec-hdr{padding:13px 16px}
  .q-row{padding:14px 16px}
  .q-txt{font-size:16px}
  .lkrt{gap:3px}
  .lk label{font-size:17px;padding:10px 3px}
  .lk-desc{font-size:12px}
  .consent-sec{padding:20px 18px}
  .agree-box{padding:18px}
  .demo-grid{padding:16px}
  .consent-grid{grid-template-columns:1fr}
}
</style>
</head>
<body class="lang-th">

<!-- ══ LANG BAR ══ -->

  sec.items.forEach(function(q){

    var scale=LANG==='th'?SCALE_TH:SCALE_EN;
    var opts='';
    for(var v=1;v<=5;v++){
      opts+='<div class="lk"><input type="radio" name="'+q.id+'" id="'+q.id+'_'+v+'" value="'+v+'">'+
        '<label for="'+q.id+'_'+v+'">'+v+'<span class="lk-desc" data-idx="'+(v-1)+'">'+scale[v-1]+'</span></label></div>';
    }
    var th=q.th.replace(/"/g,'&quot;'),en=q.en.replace(/"/g,'&quot;');
    row.innerHTML='<div class="q-top"><span class="q-id">'+q.id+'</span>'+
      '<span class="q-txt" data-th="'+th+'" data-en="'+en+'">'+q.th+'</span></div>'+
      '<div class="lkrt-lbls"><span data-th="ไม่เห็นด้วยอย่างยิ่ง" data-en="Strongly Disagree"></span>'+
      '<span data-th="เห็นด้วยอย่างยิ่ง" data-en="Strongly Agree"></span></div>'+
      '<div class="lkrt">'+opts+'</div>'+
      '<div class="err-msg" data-th="กรุณาเลือกคำตอบ" data-en="Please select a response."></div>';
    body.appendChild(row);
    row.querySelectorAll('input[type=radio]').forEach(function(inp){
      inp.addEventListener('change',function(){
        row.classList.add('answered');row.classList.remove('error');
        updateProg();
      });

  card.appendChild(body);
});

// ── LANG ──
function setLang(l){
  LANG=l;
  document.querySelectorAll('.lbtn').forEach(function(b){b.classList.remove('on')});
  document.querySelector('.lbtn[onclick="setLang(\''+l+'\')"]').classList.add('on');
  document.documentElement.lang=l;
  document.body.classList.toggle('lang-en', l==='en');
  document.body.classList.toggle('lang-th', l==='th');
  applyLang();
  var inp=document.getElementById('pos-other-input');
  if(inp && inp.style.display!=='none'){
    inp.placeholder=l==='th'?'โปรดระบุตำแหน่ง...':'Please specify your position...';
  }
  if(document.getElementById('page-dash').classList.contains('active')) renderDash();
}
function tx(el){var a='data-'+LANG;if(el.hasAttribute(a))el.innerHTML=el.getAttribute(a);}
function applyLang(){
  document.querySelectorAll('[data-th],[data-en]').forEach(tx);
  document.querySelectorAll('.lk-desc').forEach(function(d){
    d.textContent=(LANG==='th'?SCALE_TH:SCALE_EN)[+d.getAttribute('data-idx')];
  });
  document.querySelectorAll('option[data-th]').forEach(function(o){
    o.textContent=o.getAttribute('data-'+LANG)||o.textContent;
  });
}

// ── PROGRESS ──
function updateProg(){

  var p=Math.round(a/85*100);
  document.getElementById('prog-fill').style.width=p+'%';
  document.getElementById('prog-lbl').textContent=a+' / 85';
  document.getElementById('pmf').style.width=p+'%';
  document.getElementById('pmtxt').textContent=a+'/85';

// ── CONSENT ──
function selectConsent(choice){
  var optAgree   = document.getElementById('opt-agree');
  var optDecline = document.getElementById('opt-decline');
  var declineMsg = document.getElementById('decline-msg');
  var btn        = document.getElementById('btn-start');
  var radioAgree = document.getElementById('radio-agree');
  var radioDec   = document.getElementById('radio-decline');

  optAgree.classList.remove('selected-agree','selected-decline');
  optDecline.classList.remove('selected-agree','selected-decline');
  declineMsg.classList.remove('show');
  btn.classList.remove('ready');

    optAgree.classList.add('selected-agree');

    applyLang();

    optDecline.classList.add('selected-decline');
    radioDec.checked=true;
    declineMsg.classList.add('show');

  }
}

// ── TABS ──
function goTab(t){
  ['consent','form','dash'].forEach(function(p){
    document.getElementById('page-'+p).classList.remove('active');
    document.getElementById('t-'+p).classList.remove('on');
  });
  document.getElementById('page-'+t).classList.add('active');
  document.getElementById('t-'+t).classList.add('on');

// ── SUBMIT ──
document.getElementById('mainForm').addEventListener('submit',function(e){
  e.preventDefault();
  var valid=true,first=null;
  document.querySelectorAll('.q-row').forEach(function(row){
    var inp=row.querySelector('input[type=radio]');if(!inp)return;
    if(!row.querySelector('input:checked')){
      row.classList.add('error');row.classList.remove('answered');
      valid=false;if(!first)first=row;
    }else row.classList.remove('error');
  });
  if(!valid){first.scrollIntoView({behavior:'smooth',block:'center'});return;}
  var rec={lang:LANG,ts:new Date().toLocaleString('th-TH'),demo:{},resp:{}};
  new FormData(this).forEach(function(v,k){
    if(['gender','age','education','experience','position','position_other','company_size','telecom_type'].includes(k))
      rec.demo[k]=v;
    else rec.resp[k]=+v;
  });
  var vals=Object.values(rec.resp);
  rec.mean=(vals.reduce(function(a,b){return a+b;},0)/vals.length).toFixed(2);

  /* ── Show sending state ── */
  var subBtn=document.querySelector('.btn-sub');
  var origTxt=subBtn.textContent;
  subBtn.textContent=LANG==='th'?'กำลังส่ง...':'Sending...';
  subBtn.disabled=true;

  /* ── Save locally first ── */
  responses.push(rec);
  localStorage.setItem('aic_telecom_resp',JSON.stringify(responses));

  /* ── Send to Google Sheets backend ── */
  function showSendStatus(ok){
    var el=document.getElementById('send-status');
    if(!el)return;
    if(ok){
      el.style.background='#e8f7ef';el.style.color='#16724a';
      el.textContent=LANG==='th'?'✅ ส่งข้อมูลไป Google Sheets สำเร็จ':'✅ Sent to Google Sheets successfully';
    } else {
      el.style.background='#fdf3dc';el.style.color='#b8861a';
      el.textContent=LANG==='th'?'⚠ บันทึกในเครื่องแล้ว (กรุณาตรวจสอบ internet)':'⚠ Saved locally (check internet connection)';
    }
    el.style.display='block';
  }
  function afterSend(ok){
    subBtn.textContent=origTxt;
    subBtn.disabled=false;
    document.getElementById('mainForm').reset();
    document.querySelectorAll('.q-row').forEach(function(r){r.classList.remove('answered','error');});
    updateProg();
    showSendStatus(ok);
    document.getElementById('overlay').classList.add('show');
  }

  if(SCRIPT_URL && SCRIPT_URL!=='PASTE_YOUR_WEB_APP_URL_HERE'){
    fetch(SCRIPT_URL,{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(rec)
    }).then(function(){
      afterSend(true);
    }).catch(function(err){
      console.warn('Backend send failed (data saved locally):', err);
      afterSend(false);
    });
  } else {
    console.warn('SCRIPT_URL not set — data saved locally only.');
    afterSend(false);
  }
});
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  goTab('dash');
}

// ── CONNECTION BANNER ──
function renderConnBanner(){

  if(configured){
    el.style.background='#e8f7ef';el.style.border='1px solid #a8dfc0';el.style.color='#16724a';
    el.innerHTML='<span>🟢 <strong>'+(LANG==='th'?'เชื่อมต่อ Google Sheets แล้ว':'Connected to Google Sheets')+'</strong> — '+(LANG==='th'?'ข้อมูลจะส่งอัตโนมัติเมื่อผู้ตอบกด Submit':'Responses are sent automatically on Submit')+'</span>';
  } else {

    el.innerHTML='<span>⚠ <strong>'+(LANG==='th'?'ยังไม่ได้ตั้งค่า Backend':'Backend not configured')+'</strong> — '+(LANG==='th'?'ข้อมูลเก็บในเครื่องผู้ตอบเท่านั้น ใส่ SCRIPT_URL เพื่อส่งไป Google Sheets':'Data stored locally only. Set SCRIPT_URL to enable Google Sheets sync')+'</span>'+
    '<a href="https://script.google.com" target="_blank" style="color:#1d5fa8;font-size:12px;white-space:nowrap">'+(LANG==='th'?'เปิด Apps Script →':'Open Apps Script →')+'</a>';
  }
}

// ── DASHBOARD ──
function renderDash(){
  renderConnBanner();
  var tot=responses.length;
  var thC=responses.filter(function(r){return r.lang==='th';}).length;
  document.getElementById('d-total').textContent=tot;
  document.getElementById('d-th').textContent=thC;
  document.getElementById('d-en').textContent=tot-thC;
  if(!tot){document.getElementById('d-avg').textContent='—';renderTable();return;}
  var ms=responses.map(function(r){return+r.mean;});
  document.getElementById('d-avg').textContent=(ms.reduce(function(a,b){return a+b;},0)/ms.length).toFixed(2);
  buildConstructChart();
  buildDonut('ch-pos','position',{c_level:'C-Level',vp_svp:'VP/SVP',director:'Director',dept_head:'Dept Head',senior_mgr:'Sr Manager',manager:'Manager',team_lead:'Team Lead',specialist:'Specialist',consultant:'Consultant',other:'Other'});
  buildDonut('ch-tel','telecom_type',{mobile:'Mobile(MNO)',fixed:'Fixed/ISP',satellite:'Satellite',infra:'Infrastructure',cloud:'Cloud/DC',other:'Other'});
  buildDonut('ch-age','age',{u30:'<30','30-39':'30-39','40-49':'40-49','50-59':'50-59','60+':'60+'});
  buildDonut('ch-sz','company_size',{'lt50':'<50','50-199':'50-199','200-999':'200-999','1000-4999':'1000-4999','5000+':'5000+'});
  renderTable();
}
function buildConstructChart(){
  var labels=[],vals=[],colors=[];
  SECTIONS.forEach(function(sec){
    var ids=sec.items.map(function(i){return i.id;});
    var all=[];
    responses.forEach(function(r){ids.forEach(function(id){if(r.resp[id])all.push(r.resp[id]);});});
    var avg=all.length?(all.reduce(function(a,b){return a+b;},0)/all.length):0;
    labels.push(sec.key);vals.push(+avg.toFixed(2));
    colors.push(avg>=4?'#16724a':avg>=3?'#1d5fa8':'#b8861a');
  });
  if(charts['con'])charts['con'].destroy();
  charts['con']=new Chart(document.getElementById('ch-construct').getContext('2d'),{
    type:'bar',data:{labels:labels,datasets:[{data:vals,backgroundColor:colors,borderRadius:5,borderSkipped:false}]},
    options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{min:1,max:5,ticks:{stepSize:1}},y:{ticks:{font:{size:11}}}},maintainAspectRatio:false}
  });
}
function buildDonut(id,field,lmap){
  var counts={};
  responses.forEach(function(r){var v=r.demo[field]||'—';counts[v]=(counts[v]||0)+1;});
  var pal=['#1d5fa8','#16724a','#b8861a','#3b9ede','#6b7a92','#c0392b','#0b1929','#3a7ca5'];
  var labels=Object.keys(counts).map(function(k){return lmap[k]||k;});
  if(charts[id])charts[id].destroy();
  if(!document.getElementById(id))return;
  charts[id]=new Chart(document.getElementById(id).getContext('2d'),{
    type:'doughnut',
    data:{labels:labels,datasets:[{data:Object.values(counts),backgroundColor:pal.slice(0,labels.length),borderWidth:2,borderColor:'#fff'}]},
    options:{plugins:{legend:{position:'bottom',labels:{font:{size:10},boxWidth:11}}},maintainAspectRatio:false}
  });
}
function renderTable(){
  var tb=document.getElementById('rtbl-body');tb.innerHTML='';
  if(!responses.length){
    var tr=document.createElement('tr');
    tr.innerHTML='<td colspan="6" class="no-data" data-th="ยังไม่มีข้อมูล กรุณากรอกแบบสอบถาม" data-en="No data yet. Please complete the questionnaire."></td>';
    tb.appendChild(tr);applyLang();return;
  }
  responses.forEach(function(r,i){
    var tr=document.createElement('tr');
    var bdg=r.lang==='th'?'<span class="badge badge-th">ไทย</span>':'<span class="badge badge-en">EN</span>';
    tr.innerHTML='<td>'+(i+1)+'</td><td>'+bdg+'</td><td style="font-size:11px">'+r.ts+'</td>'+
      '<td>'+(r.demo.position||'—')+'</td><td>'+(r.demo.telecom_type||'—')+'</td>'+
      '<td><strong>'+r.mean+'</strong></td>';
    tb.appendChild(tr);
  });
}

// ── EXCEL EXPORT ──
function exportExcel(){
  if(!responses.length){alert(LANG==='th'?'ยังไม่มีข้อมูล':'No data to export.');return;}
  var wb=XLSX.utils.book_new();
  var allIds=[];SECTIONS.forEach(function(s){s.items.forEach(function(q){allIds.push(q.id);});});
  var hdr=['#','Language','Timestamp','Gender','Age','Education','Experience','Position','Position (Other)','CompanySize','TelecomType','Mean'].concat(allIds);
  var rows=responses.map(function(r,i){
    var d=r.demo;
    var base=[i+1,r.lang,r.ts,d.gender||'',d.age||'',d.education||'',d.experience||'',d.position||'',d.position_other||'',d.company_size||'',d.telecom_type||'',r.mean];
    return base.concat(allIds.map(function(id){return r.resp[id]||'';}));
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([hdr].concat(rows)),'Raw Data');

  // Construct summary
  var sh=['Construct','Name (EN)','Name (TH)','N Items','N Responses','Mean','Std Dev'];
  var sr=SECTIONS.map(function(sec){
    var ids=sec.items.map(function(i){return i.id;});
    var vals=[];responses.forEach(function(r){ids.forEach(function(id){if(r.resp[id])vals.push(r.resp[id]);});});
    var mean=vals.length?(vals.reduce(function(a,b){return a+b;},0)/vals.length).toFixed(3):'-';
    var sd='-';
    if(vals.length>1){var m=+mean;sd=Math.sqrt(vals.reduce(function(a,v){return a+Math.pow(v-m,2);},0)/(vals.length-1)).toFixed(3);}
    return[sec.key,sec.en,sec.th,ids.length,vals.length,mean,sd];
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([sh].concat(sr)),'Construct Summary');

  // Item summary
  var ih=['Item ID','Section','Question (EN)','Question (TH)','N','Mean','Std Dev'];
  var ir=[];
  SECTIONS.forEach(function(sec){sec.items.forEach(function(q){
    var vals=responses.map(function(r){return r.resp[q.id];}).filter(Boolean);
    var mean=vals.length?(vals.reduce(function(a,b){return a+b;},0)/vals.length).toFixed(3):'-';
    var sd='-';
    if(vals.length>1){var m=+mean;sd=Math.sqrt(vals.reduce(function(a,v){return a+Math.pow(v-m,2);},0)/(vals.length-1)).toFixed(3);}
    ir.push([q.id,sec.key,q.en,q.th,vals.length,mean,sd]);
  });});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([ih].concat(ir)),'Item Summary');

  XLSX.writeFile(wb,'AIC_Telecom_Questionnaire_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

function clearData(){
  var m=LANG==='th'?'ต้องการล้างข้อมูลทั้งหมดหรือไม่?':'Clear all response data?';
  if(confirm(m)){responses=[];localStorage.removeItem('aic_telecom_resp');renderDash();}
}

updateProg();
